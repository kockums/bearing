# =============================================================================
# Pytest Configuration
# =============================================================================
# Single point of truth for test execution
# See: https://docs.pytest.org/

[pytest]
# Basic settings
minversion = 8.0
testpaths = tst tst/cases
pythonpath = src

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Command-line options
addopts =
    -ra
    --strict-markers
    --strict-config
    --verbose
    --showlocals
    --cov=bearing
    --cov-branch
    --cov-config=.coveragerc
    --cov-report=term-missing:skip-covered
    --cov-report=html
    --cov-report=xml
    --cov-report=json
    --no-cov-on-fail

# Test markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    smoke: marks tests as smoke tests (quick sanity checks)
    regression: marks tests for regression testing
    security: marks tests for security checks

# Warning filters
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ResourceWarning

# Console output
console_output_style = progress

# Log settings
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
