# =============================================================================
# Tox Configuration
# =============================================================================
# Single point of truth for testing across Python versions
# See: https://tox.wiki/

[tox]
envlist = py312,lint,type,security
isolated_build = True
skip_missing_interpreters = True

[testenv]
description = Run unit tests with pytest
deps =
    pytest>=8.3.4
    pytest-cov>=6.0.0
commands =
    pytest --cov=bearing --cov-report=term-missing:skip-covered tst/

[testenv:py312]
description = Run tests with Python 3.12
basepython = python3.12

[testenv:lint]
description = Run linting with flake8 and pylint
deps =
    flake8>=7.1.0
    pylint>=4.0.4
commands =
    flake8 src/
    pylint src/

[testenv:type]
description = Run type checking with mypy
deps =
    mypy>=1.14.1
commands =
    mypy src/

[testenv:format]
description = Check code formatting with black and isort
deps =
    black>=24.8.0
    isort>=5.10.1
commands =
    black --check src/ tst/
    isort --check-only src/ tst/

[testenv:format-fix]
description = Auto-format code with black and isort
deps =
    black>=24.8.0
    isort>=5.10.1
commands =
    black src/ tst/
    isort src/ tst/

[testenv:security]
description = Run security checks with bandit
deps =
    bandit[toml]>=1.7.5
commands =
    bandit -r src/ -c pyproject.toml

[testenv:docs]
description = Build documentation with sphinx
deps =
    sphinx>=8.0.2
commands =
    sphinx-build -W -b html doc {envtmpdir}/html

[testenv:clean]
description = Clean up temporary files and caches
deps =
skip_install = True
commands =
    python -c "import shutil; import pathlib; [shutil.rmtree(p, ignore_errors=True) for p in pathlib.Path('.').rglob('__pycache__')]"
    python -c "import shutil; import pathlib; [shutil.rmtree(p, ignore_errors=True) for p in ['.pytest_cache', '.mypy_cache', '.tox', 'build', 'dist', 'htmlcov', '.coverage']]"
