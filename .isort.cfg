# =============================================================================
# isort Configuration
# =============================================================================
# Single point of truth for import sorting
# See: https://pycqa.github.io/isort/

[settings]
profile = black
line_length = 79

# Output formatting
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
split_on_trailing_comma = true

# Ensure files end with exactly one newline
ensure_newline_before_comments = true

# Import discovery
skip_gitignore = true
skip = .eggs,.git,.hg,.mypy_cache,.tox,.venv,_build,buck-out,build,dist,htmlcov,bup,wip,tmp

# Import classification
known_first_party = bearing
known_third_party =
sections = FUTURE,STDLIB,THIRDPARTY,FIRSTPARTY,LOCALFOLDER

# Custom section headers
import_heading_future = Import | Future
import_heading_stdlib = Import | Standard Library
import_heading_thirdparty = Import | Libraries
import_heading_firstparty = Import | Local Modules
import_heading_localfolder = Import | Local Modules

# Behavior
force_alphabetical_sort_within_sections = true
force_sort_within_sections = true
honor_noqa = true
