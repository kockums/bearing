# =============================================================================
# GitHub Actions Workflow: Label Pull Requests
# =============================================================================

name: Label PRs

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Auto-label PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml

      - name: Label based on PR size
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const additions = pr.additions;
            const deletions = pr.deletions;
            const total = additions + deletions;

            let sizeLabel = '';
            if (total < 10) sizeLabel = 'size/xs';
            else if (total < 50) sizeLabel = 'size/s';
            else if (total < 200) sizeLabel = 'size/m';
            else if (total < 500) sizeLabel = 'size/l';
            else sizeLabel = 'size/xl';

            // Remove old size labels
            const oldLabels = ['size/xs', 'size/s', 'size/m', 'size/l', 'size/xl'];
            for (const label of oldLabels) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  name: label
                });
              } catch (e) {
                // Label doesn't exist, ignore
              }
            }

            // Add new size label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: [sizeLabel]
            });

      - name: Label breaking changes
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const title = pr.title || '';

            if (title.includes('BREAKING') || title.includes('!:') || body.includes('BREAKING CHANGE')) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: ['breaking-change']
              });
            }
