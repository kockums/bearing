# =============================================================================
# GitHub Actions Workflow: Stale Issues and PRs
# =============================================================================

name: Stale

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark Stale Issues and PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Issues
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-label: "stale"
          stale-issue-message: |
            This issue has been automatically marked as stale because it has not had
            recent activity. It will be closed in 14 days if no further activity occurs.

            If this is still relevant, please:
            - Comment to keep it open
            - Add more information
            - Remove the 'stale' label

            Thank you for your contributions!
          close-issue-message: |
            This issue has been automatically closed due to inactivity.
            Feel free to reopen it if you have additional information.
          exempt-issue-labels: "pinned,security,enhancement,good-first-issue"
          # Pull Requests
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-pr-label: "stale"
          stale-pr-message: |
            This pull request has been automatically marked as stale because it has not had
            recent activity. It will be closed in 7 days if no further activity occurs.

            Please:
            - Rebase if there are conflicts
            - Respond to review comments
            - Update tests if needed
          close-pr-message: |
            This pull request has been automatically closed due to inactivity.
            Feel free to reopen it or create a new PR with updated changes.
          exempt-pr-labels: "pinned,security,dependencies"
          # Operations
          operations-per-run: 100
          remove-stale-when-updated: true
          ascending: true
